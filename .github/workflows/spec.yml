name: spec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify nova-design.md is regenerated
        run: python3 scripts/build_spec.py --check
      - name: Report size
        run: wc -l nova-design.md examples/*.md prompts/*.md
