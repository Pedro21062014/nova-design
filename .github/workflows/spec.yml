name: spec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify design.md is regenerated
        run: python3 scripts/build_spec.py --check
      - name: Verify components/ and templates/ are regenerated
        run: python3 scripts/build_components.py --check
      - name: Verify raw links resolve and no emoji are present
        run: python3 scripts/check_links.py
      - name: Report size
        run: wc -l design.md examples/*.md prompts/*.md
